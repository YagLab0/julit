[package]
name = "julit"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "julit"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
no-idl = []
no-anchor-event = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.32.1"
anchor-spl = "0.32.1"
mpl-token-metadata = "5.1.1"

[dev-dependencies]
anchor-lang = "=0.32.1"
litesvm = "0.7.1"
openssl-sys = { version = "0.9.117", features = ["vendored"] }
solana-sdk = "2"
spl-associated-token-account = "7"
spl-token = "8"
